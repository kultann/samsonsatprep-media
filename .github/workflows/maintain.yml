name: maintain

on:
  schedule:
    - cron: "30 9 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete videos that are live everywhere
        run: python3 tools/prune.py
      - name: Commit
        run: |
          git config user.name "media-bot"
          git config user.email "media-bot@users.noreply.github.com"
          git add -A shorts
          git diff --cached --quiet && exit 0
          git commit -m "prune posted videos $(date -u +%Y-%m-%d)"
          git push
